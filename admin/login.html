<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #F7F2F0; color: #2E0B12; font-family: 'Jost', system-ui, sans-serif"><div style="position: relative; overflow: hidden; flex: 1 1 520px; min-height: 560px; background: #2E0B12"><img src="/images/model-body-wave-brown.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; opacity: 0.55"><div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(46,11,18,0.3) 0%, rgba(26,6,9,0.92) 100%)"></div><div style="position: relative; height: 100%; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; color: #F4ECE8"><div style="display: flex; align-items: center; gap: 12px"><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 52px; font-weight: 600; letter-spacing: -2px; line-height: 1; background: linear-gradient(180deg, #FFFFFF 0%, #E6E6E8 30%, #8E8E94 55%, #E6E6E8 75%, #B8B8BC 100%); -webkit-background-clip: text; background-clip: text; color: transparent">HL</span><span style="display: flex; flex-direction: column; gap: 3px"><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; letter-spacing: 4px">HOUSE OF LOVETH</span><span style="font-size: 11px; letter-spacing: 3px; color: #E8C2BE">STORE ADMIN</span></span></div><div style="display: flex; flex-direction: column; gap: 10px"><span style="font-family: 'Pinyon Script', cursive; font-size: 40px; color: #F0CFCB">Welcome back</span><span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 46px; line-height: 1.1; max-width: 460px">Every order is someone’s little dream come true.</span></div></div></div><div style="flex: 1 1 480px; display: flex; align-items: center; justify-content: center; padding: 48px 32px; box-sizing: border-box"><form onsubmit="event.preventDefault();location.href='/admin'" style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px"><div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 42px; font-weight: 500">Staff sign in</h1><p style="margin: 0; font-size: 14px; color: #7A5A5E">Use the email your invite was sent to.</p></div><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #4A1220">Email<input type="email" placeholder="name@email.com" value="" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #E2D2CE; background: #FFFFFF; color: #2E0B12; font-family: inherit; font-size: 14px"></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: #4A1220"><span style="display: flex; justify-content: space-between">Password<a href="#" style="font-weight: 400">Forgot password?</a></span><span style="position: relative; display: flex; align-items: center"><input type="password" value="dreamhair" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #E2D2CE; background: #FFFFFF; color: #2E0B12; font-family: inherit; font-size: 14px; padding-right: 48px"><button type="button" aria-label="Show password" style="position: absolute; right: 4px; width: 40px; height: 40px; border: none; background: transparent; color: #7A5A5E; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label><label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 40px"><input type="checkbox" checked style="accent-color: #6E1A2C; width: 18px; height: 18px">Remember this device for 30 days</label><button type="button" class="press" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; box-sizing: border-box; white-space: nowrap; border: none; background: linear-gradient(180deg, #6E1A2C 0%, #4A1220 60%, #2E0B12 100%); color: #F4ECE8; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 6px 14px rgba(46,11,18,0.25); width: 100%; min-height: 52px; font-size: 15px">Sign in</button><div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: #FFFFFF; border: 1px solid #EADCD8"><span style="flex: none; width: 38px; height: 38px; border-radius: 10px; background: #F6E3E1; color: #6E1A2C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></span><span style="font-size: 13px; line-height: 1.5; color: #4A1220">Next, we’ll ask for your 2-step verification code.</span></div><a href="/app/admin-home" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; font-size: 14px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg>Install the admin app on this device</a></form></div></div>
