<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile product page</title>
<meta name="description" content="Dream Hair by Loveth — luxury wigs and hair from House of Loveth. A breath of fresh hair.">
<meta name="theme-color" content="#1A0609">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
<link rel="stylesheet" href="/assets/apple.css">
<style>
html,body{min-height:100%}
body{margin:0;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;box-sizing:border-box;overflow-x:auto}
.frame{flex:none;border-radius:32px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5)}
</style>
</head>
<body class="theme-dark">
<div class="frame">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1A0609; color: #F5F5F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 8px; border-bottom: 1px solid rgba(184,184,188,0.25)">
<button onclick="location.href='/shop'" type="button" aria-label="Back" style="width: 44px; height: 44px; background: transparent; border: none; color: #F5F5F7"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 28px; font-weight: 500; color: #F5F5F7; letter-spacing: -1px">HL</span>
<button onclick="location.href='/bag'" type="button" aria-label="Cart" style="width: 44px; height: 44px; background: transparent; border: none; color: #F5F5F7"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8h14l-1.5 12h-11z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></button>
</div>
<div style="height: 340px; background: #4A1220; display: flex; align-items: center; justify-content: center; flex: none">
<span style="font-size: 14px; color: #A1A1A6; font-weight: 600">[PRODUCT PHOTO]</span>
</div>
<div style="padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1">
<span style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; color: #C4918E; font-weight: 600; letter-spacing: -0.01em">Bestseller</span>
<h1 style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 31px; line-height: 1.1; letter-spacing: -0.022em">Bone Straight Wig</h1>
<span style="font-size: 20px; color: #F5F5F7">[PRICE]</span>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
<span style="font-size: 14px; color: #A1A1A6; font-weight: 600">Length</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="min-width: 56px; height: 44px; background: transparent; border: 1px solid rgba(184,184,188,0.5); color: #F5F5F7; font-family: inherit; font-size: 14px">12"</button>
<button type="button" style="min-width: 56px; height: 44px; background: #E6E6E8; border: 1px solid #E6E6E8; color: #1A0609; font-family: inherit; font-size: 14px">16"</button>
<button type="button" style="min-width: 56px; height: 44px; background: transparent; border: 1px solid rgba(184,184,188,0.5); color: #F5F5F7; font-family: inherit; font-size: 14px">20"</button>
<button type="button" style="min-width: 56px; height: 44px; background: transparent; border: 1px solid rgba(184,184,188,0.5); color: #F5F5F7; font-family: inherit; font-size: 14px">24"</button>
</div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.6; font-weight: 400">[SHORT PRODUCT DESCRIPTION — HAIR TYPE, LACE, DENSITY]</p>
</div>
<div style="padding: 16px 20px 28px; border-top: 1px solid rgba(184,184,188,0.25)">
<button onclick="location.href='/bag'" type="button" style="width: 100%; height: 54px; background: #E6E6E8; color: #1A0609; border: none; font-family: inherit; font-size: 14px; font-weight: 500">Add to bag</button>
</div>
</div>
</div>
</body>
</html>
