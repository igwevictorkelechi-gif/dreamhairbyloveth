<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App — Splash screen</title>
<meta name="description" content="Dream Hair by Loveth — luxury wigs and hair from House of Loveth. A breath of fresh hair.">
<meta name="theme-color" content="#1A0609">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F4ECE8}a:hover{color:#E8C2BE}
.lift{transition:transform .35s ease}
.lift:hover{transform:translateY(-4px)}
.zoom img{transition:transform .7s ease}
.zoom:hover img{transform:scale(1.03)}
.press{transition:transform .2s ease, filter .2s ease}
.press:hover{transform:translateY(-2px);filter:brightness(1.06)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.chev{transition:transform .3s ease}
details[open] .chev{transform:rotate(180deg)}
input::placeholder,textarea::placeholder{color:rgba(244,236,232,0.55)}
</style>
<link rel="stylesheet" href="/assets/apple.css">
<style>
html,body{min-height:100%}
body{margin:0;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;box-sizing:border-box;overflow-x:auto}
.frame{flex:none;border-radius:32px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.5)}
</style>
</head>
<body class="theme-dark" data-page="app-splash">
<div class="frame">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: transparent; color: #F5F5F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px"><span aria-hidden="true" style="position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); width: 320px; height: 320px; border-radius: 980px; border: 1px solid rgba(230,230,232,0.12)"></span><span style="position: relative; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 120px; font-weight: 600; letter-spacing: -6px; line-height: 1; color: #F5F5F7">HL</span><span style="position: relative; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; letter-spacing: 6px">HOUSE OF LOVETH</span><span style="position: relative; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 21px; color: #D9A7A3; font-weight: 600; letter-spacing: -0.01em">A Breath of Fresh Hair</span><span aria-label="Loading" role="img" style="position: absolute; bottom: 72px; display: flex; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 980px; background: #E6E6E8"></span><span style="width: 8px; height: 8px; border-radius: 980px; background: rgba(230,230,232,0.5)"></span><span style="width: 8px; height: 8px; border-radius: 980px; background: rgba(230,230,232,0.25)"></span></span></div>
</div>
</body>
</html>
