<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank-you insert card</title>
<meta name="description" content="Dream Hair by Loveth — luxury wigs and hair from House of Loveth. A breath of fresh hair.">
<meta name="theme-color" content="#1A0609">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Pinyon+Script&amp;family=Jost:wght@300;400;500&amp;display=swap">
<style>
body{margin:0}
</style>
<style>
html,body{min-height:100%}
body{margin:0;background:#0d0204;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;box-sizing:border-box;overflow-x:auto}
.frame{flex:none;border-radius:0;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="frame">
<div style="width: 1050px; height: 600px; box-sizing: border-box; background: #F4ECE8; padding: 28px; font-family: 'Jost', system-ui, sans-serif; color: #2E0B12">
<div style="width: 100%; height: 100%; box-sizing: border-box; border: 1px solid #C4918E; display: grid; grid-template-columns: 380px 1fr">
<div style="background: #2E0B12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 110px; font-weight: 500; color: #E6E6E8; letter-spacing: -6px; line-height: 1">HL</span>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; letter-spacing: 5px; color: #E6E6E8">HOUSE OF LOVETH</span>
<span style="font-family: 'Pinyon Script', cursive; font-size: 28px; color: #C4918E">A Breath of Fresh Hair</span>
</div>
<div style="display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 48px 56px">
<span style="font-family: 'Pinyon Script', cursive; font-size: 56px; color: #4A1220; line-height: 1">Thank you</span>
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-style: italic">for dreaming with us.</span>
<span aria-hidden="true" style="width: 100px; height: 1px; background: #C4918E"></span>
<p style="margin: 0; font-size: 17px; line-height: 1.7; font-weight: 300">You're more than a customer — you're family. Tag us in your new look and enjoy [DISCOUNT]% off your next order with code [CODE].</p>
<span style="font-size: 14px; letter-spacing: 3px; color: #4A1220">@[INSTAGRAM HANDLE] · HOUSEOFLOVETHHAIR.COM</span>
</div>
</div>
</div>
</div>
</body>
</html>
